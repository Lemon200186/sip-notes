<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sip Notes · 一杯一页</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>☕</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe3cc;--card:#f8f0df;--ink:#3b2a20;--soft:#8a6f5a;--tape:#c9a45c;--accent:#7a3b22;--line:#d9c7a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2a201a;--card:#352920;--ink:#f0e2c8;--soft:#b49b80;--tape:#8b6d34;--accent:#e0a074;--line:#4a3b2f}}
:root[data-theme="dark"]{--paper:#2a201a;--card:#352920;--ink:#f0e2c8;--soft:#b49b80;--tape:#8b6d34;--accent:#e0a074;--line:#4a3b2f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);color:var(--ink);font:16px/1.7 "Noto Serif SC",Georgia,serif}
main{max-width:620px;margin:0 auto;padding:28px 18px 80px}
h1{font:400 44px/1.1 "Ma Shan Zheng",cursive;margin:8px 0 2px}
.sub{color:var(--soft);margin:0 0 24px;font-size:14px}
.pad{background:var(--card);padding:18px;border-radius:3px;box-shadow:0 1px 0 var(--line),0 6px 14px rgba(60,35,15,.12);position:relative;margin-bottom:22px}
.pad:before,.card:before{content:"";position:absolute;top:-10px;left:28px;width:74px;height:20px;background:var(--tape);opacity:.75;transform:rotate(-3deg)}
label,.lab{display:block;font-size:13px;color:var(--soft);margin:14px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--soft);padding:5px 2px;border-radius:0}
select option{color:#000}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:6px 14px;border-radius:3px}
button.main{background:var(--ink);color:var(--card)}button:disabled{opacity:.45;cursor:default}
.link{border:0;padding:6px 2px;color:var(--soft);text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:18px;padding:3px 13px;font-size:14px;border:1.5px solid var(--soft);color:var(--soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.status{font-size:13px;color:var(--accent);min-height:20px;margin-top:8px}
.hide{display:none!important}
.snap{border:2px dashed var(--soft);border-radius:4px;padding:22px 14px;text-align:center;background:color-mix(in srgb,var(--tape) 14%,transparent)}
.snap .big{font:400 24px/1.3 "Ma Shan Zheng",cursive;margin:0 0 10px}
.snap .bar{justify-content:center;margin-top:6px}
.snap img{max-width:100%;max-height:260px;border:6px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:rotate(-1.5deg)}
.who{padding:10px 12px;margin-top:10px;background:color-mix(in srgb,var(--tape) 18%,transparent);border-left:3px solid var(--tape)}
.pre h2{font:400 26px/1.3 "Ma Shan Zheng",cursive;margin:0 0 4px}
.pre input.t{font:400 22px "Ma Shan Zheng",cursive}
.pre .g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.tools{display:flex;gap:10px;margin:26px 0 8px;align-items:center}.tools input{flex:1}
.people{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--card);padding:16px;margin:28px 0;position:relative;box-shadow:0 1px 0 var(--line),0 5px 12px rgba(60,35,15,.1);display:flex;gap:14px}
.card:nth-child(odd){transform:rotate(-.5deg)}.card:nth-child(even){transform:rotate(.4deg)}
.card:before{left:auto;right:24px;width:56px;transform:rotate(4deg)}
.thumb{width:92px;height:92px;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-3deg);flex:none}
.card h3{margin:0;font:400 25px/1.3 "Ma Shan Zheng",cursive}
.date{font-size:12px;color:var(--soft)}
.story{font-size:17px;line-height:1.75;margin:6px 0}
.meta{font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--soft);border-radius:10px;padding:0 8px;margin:6px 4px 0 0;color:var(--soft)}
.del{margin-left:auto;font-size:12px;border:0;color:var(--soft);padding:0;align-self:flex-start}
.empty{text-align:center;color:var(--soft);padding:30px 0}
.lang{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:9;display:flex;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden}.lang button{border:0;border-radius:0;padding:2px 12px;font-size:13px}.lang button.on{background:var(--ink);color:var(--card)}
.fbfab{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--card);border-radius:20px;padding:6px 16px;box-shadow:0 3px 10px rgba(0,0,0,.3)}.fbback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.fbpanel{background:var(--card);width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px;border-radius:3px}.fbpanel h2{font:400 24px "Ma Shan Zheng",cursive;margin:0 0 4px}
.acts{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px;align-self:flex-start}.acts .del{margin-left:0;align-self:auto}.ed{font-size:12px;border:0;color:var(--soft);padding:0}
details{margin-top:14px}summary{cursor:pointer;color:var(--soft);font-size:14px}summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumbs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}.th{position:relative}.snap .th img{width:96px;height:96px;max-height:none;object-fit:cover;border:4px solid #fff;transform:none}.th .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;padding:0;line-height:1;background:var(--ink);color:var(--card);font-size:14px}.pvthumbs{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0}.pvth img{width:96px;height:96px;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}.pcol{flex:none;display:flex;flex-direction:column;gap:8px;align-items:center}.mini{display:flex;gap:4px}.mini img{width:40px;height:40px;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.range{display:flex;gap:10px;margin:6px 0}.range input{flex:1}.tools{flex-wrap:wrap}.tools input{min-width:140px}#acctSync{margin-left:6px}.acct{font-size:13px;color:var(--soft);margin:-14px 0 16px}.acct .link{font-size:13px}
</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language"><button type="button" data-l="zh">中文</button><button type="button" data-l="en">EN</button></div>
<main>
<h1>Sip Notes</h1>
<p class="sub">拍下一个瞬间，写一句话，AI 帮你变成一段记忆。 <a href="/about.html" style="color:var(--accent)">关于这个项目 →</a></p>

<div class="acct"><span id="acctTxt"></span><span id="acctSync"></span> <button class="link" id="acctBtn" type="button"></button> · <button class="link" id="fbLink2" type="button">反馈</button></div>
<section class="pad" id="capture" aria-label="记录一个瞬间">
  <div class="snap">
    <p class="big" id="snapTitle">先拍下这一刻</p>
    <div id="thumbs" class="thumbs"></div><div class="meta" id="capHint"></div>
    <div class="bar">
      <button class="main" id="camBtn" type="button">拍照</button>
      <button id="libBtn" type="button">从相册选</button>
    </div>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <input id="lib" type="file" accept="image/*" multiple hidden>
  </div>

  <label for="note">这一刻</label>
  <textarea id="note" placeholder="随便写：在哪、喝了什么、和谁、聊了什么……"></textarea>

  <div class="lab">和谁在一起？</div>
  <div class="chips" id="withC"></div>
  <div class="who hide" id="whoBox">
    <label for="pname" id="pLab" style="margin-top:0">名字</label>
    <input id="pname" list="plist" autocomplete="off">
    <datalist id="plist"></datalist>
    <div class="chips hide" id="pick" style="margin-top:8px"></div>
  </div>

  <div class="bar" style="margin-top:14px"><button type="button" class="link" id="moreBtn">+ 更多细节</button></div>
  <div id="more" class="hide">
    <div class="lab">饮品</div><div class="chips" id="drinkC"></div>
    <div class="lab">温度</div><div class="chips" id="tempC"></div>
    <div class="lab">甜度</div><div class="chips" id="sweetC"></div>
    <div class="lab">评分</div><div class="chips" id="starC"></div>
    <div class="lab">心情（可多选）</div><div class="chips" id="moodC"></div><input id="moodCustom" maxlength="20" placeholder="+ 自定义心情，回车添加" style="margin-top:8px">
    <div class="bar" style="margin-top:14px">
      <button type="button" class="chip" id="placeBtn">+ 添加地点</button>
      <button type="button" class="chip" id="priceBtn">+ 添加价格</button>
    </div>
    <div id="placeWrap" class="hide"><label for="place">📍 地点（可选）</label><input id="place"></div>
    <div id="priceWrap" class="hide"><label for="price">价格（可选）</label><input id="price" placeholder="例如 38 元 / $5"></div>
  </div>

  <div class="bar">
    <button class="main" id="orgBtn" type="button" disabled>✨ 整理成记忆</button>
    <button class="link" id="quickBtn" type="button" disabled>直接保存</button>
  </div>
  <div class="status" id="status" role="status"></div>
</section>

<section class="pad pre hide" id="preview" aria-label="记忆预览">
  <h2>✨ 你的记忆</h2>
  <div class="meta">AI 整理的内容都可以直接修改，不确定的地方已留空。</div>
  <label for="pvTitle">标题</label><input id="pvTitle" class="t">
  <label for="pvStory">一小段故事</label><textarea id="pvStory"></textarea>
  <div class="g">
    <div><label for="pvPlace">📍 地点</label><input id="pvPlace"></div>
    <div><label for="pvPerson">👤 人物</label><input id="pvPerson" list="plist"></div>
    <div><label for="pvDrink">☕ 饮品</label><select id="pvDrink"></select></div>
    <div><label for="pvTemp">温度</label><select id="pvTemp"></select></div>
    <div><label for="pvTopics">💬 话题（逗号分隔）</label><input id="pvTopics"></div>
    <div><label for="pvMood">心情（可多个，可自由填写）</label><input id="pvMood" placeholder="用顿号分隔"></div>
  </div>
  <details id="pvMore"><summary>甜度、评分、价格、照片</summary>
  <div class="g">
   <div><label for="pvSweet">甜度</label><select id="pvSweet"></select></div>
   <div><label for="pvRating">评分</label><select id="pvRating"></select></div>
   <div><label for="pvPrice">价格</label><input id="pvPrice"></div>
  </div>
  <div class="lab">照片（最多 3 张）</div>
  <div class="pvthumbs" id="pvThumbs"></div>
  <div class="bar" style="margin-top:4px"><button type="button" id="pvAdd">添加照片</button><span class="meta" id="pvHint"></span></div>
  <input id="pvPhoto" type="file" accept="image/*" hidden>
 </details>
 <div class="bar"><button class="main" id="saveBtn" type="button">保存记忆</button><button class="link" id="backBtn" type="button">返回修改</button></div>
</section>

<section class="pad hide" id="loginBox" aria-label="Sign in">
  <p id="loginMsg" class="meta" style="margin-top:0"></p>
  <label for="lemail">邮箱</label><input id="lemail" type="email" autocomplete="email" placeholder="you@example.com">
  <label for="lpass">密码（至少 6 位）</label><input id="lpass" type="password" autocomplete="current-password">
  <div class="bar"><button class="main" id="authBtn" type="button">登录</button><button class="link" id="modeBtn" type="button">没有账号？注册</button><button class="link" id="laterBtn" type="button">以后再说</button></div>
  <div class="status" id="lstatus" role="status"></div>
</section>
<div class="tools"><input id="q" type="search" placeholder="搜索人名、话题、地点、任何一句话" aria-label="搜索"><button type="button" id="expJ">导出日记</button><button type="button" id="exp">备份</button></div>
<div class="chips" id="timeC" style="margin:8px 0"></div>
<div class="range hide" id="rangeBox"><input type="date" id="dFrom" aria-label="开始日期"><input type="date" id="dTo" aria-label="结束日期"></div>
<div class="people" id="peopleRow"></div>
<div id="list"></div>
<p class="acct" style="margin:34px 0 0;text-align:center">Sip Notes · build 10-10 · <button class="link" id="fbLink" type="button">反馈</button></p>
</main>
<button type="button" id="fbOpen" class="fbfab">反馈</button>
<div class="fbback hide" id="fbBox" role="dialog" aria-modal="true" aria-labelledby="fbTitle"><div class="fbpanel">
 <h2 id="fbTitle">给我们反馈</h2>
 <label for="fbName">名字</label><input id="fbName" maxlength="80" autocomplete="name">
 <label for="fbType">类型</label><select id="fbType"><option value="feature_request">功能建议</option><option value="bug">问题 / Bug</option><option value="product_advice">产品建议</option></select>
 <label for="fbMsg">内容</label><textarea id="fbMsg" maxlength="4000"></textarea>
 <label for="fbContact">联系方式（可选）</label><input id="fbContact" maxlength="200" placeholder="邮箱 / 微信 / LinkedIn">
 <label for="fbImg">相关图片（可选）</label><input id="fbImg" type="file" accept="image/*">
 <div class="bar"><button class="main" id="fbSend" type="button">提交</button><button class="link" id="fbCancel" type="button">取消</button></div>
 <div class="status" id="fbStatus" role="status"></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const DICT={"拍下一个瞬间，写一句话，AI 帮你变成一段记忆。":"Capture a moment, write a line, and AI turns it into a memory.","关于这个项目 →":"About this project →","先拍下这一刻":"Capture this moment","好，再写一句话":"Nice, now write a line","拍照":"Take photo","从相册选":"Choose from library","这一刻":"This moment","随便写：在哪、喝了什么、和谁、聊了什么……":"Just write: where, what you drank, who with, what you talked about...","和谁在一起？":"Who were you with?","一个人":"Alone","认识的人":"Someone I know","新认识的人":"Someone new","对方的名字（可选）":"Their name (optional)","选择或新建一个人":"Pick or add a person","不知道名字也没关系":"Fine if you do not know the name","输入名字，或点下面的人":"Type a name, or tap one below","+ 更多细节":"+ More details","− 收起细节":"− Fewer details","饮品":"Drink","温度":"Temperature","甜度":"Sweetness","评分":"Rating","心情":"Mood","+ 添加地点":"+ Add place","+ 添加价格":"+ Add price","📍 地点（可选）":"📍 Place (optional)","价格（可选）":"Price (optional)","例如 38 元 / $5":"e.g. $5","✨ 整理成记忆":"✨ Turn into a memory","直接保存":"Save as is","✨ 你的记忆":"✨ Your memory","AI 整理的内容都可以直接修改，不确定的地方已留空。":"Everything here is editable. Anything uncertain was left blank.","标题":"Title","一小段故事":"A little story","📍 地点":"📍 Place","👤 人物":"👤 Person","☕ 饮品":"☕ Drink","💬 话题（逗号分隔）":"💬 Topics (comma-separated)","保存记忆":"Save memory","返回修改":"Back to edit","未填":"Not set","搜索人名、话题、地点、任何一句话":"Search people, topics, places, anything","搜索":"Search","导出":"Export","一个瞬间":"A moment","删除":"Delete","还没有记忆，拍下现在这一刻吧。":"No memories yet. Capture this moment.","没有匹配的记忆。":"No matching memories.","已保存。":"Saved.","正在整理成记忆……":"Organizing into a memory...","记录一个瞬间":"Record a moment","记忆预览":"Memory preview","咖啡":"Coffee","茶":"Tea","抹茶":"Matcha","奶茶":"Milk tea","其他":"Other","热":"Hot","冰":"Iced","温":"Warm","平静":"Calm","受启发":"Inspired","有连接":"Connected","思考":"Thoughtful","放松":"Relaxed","有活力":"Energetic","删除这条记忆？":"Delete this memory?","AI 暂时没成功，已用你写的内容生成预览。":"AI did not work this time. A preview was built from what you wrote.","调用太频繁了，已用你写的内容生成预览。":"Too many requests. A preview was built from what you wrote.","这张图读不了，已用你写的内容生成预览。":"This image could not be read. A preview was built from what you wrote.","你没有允许使用 Claude，已用你写的内容生成预览。":"AI is not available. A preview was built from what you wrote."};
const PAT=[[/^甜度 (.+)$/,"Sweetness $1"],[/^(\d) 星$/,"$1 stars"]];
let LANG;try{LANG=localStorage.getItem('sip-lang')}catch(e){}
if(LANG!=='zh'&&LANG!=='en')LANG=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
const tr=s=>{const k=s.trim();if(!k)return s;let v=DICT[k];if(v==null)for(const[p,r]of PAT){if(p.test(k)){v=k.replace(p,r);break}}return v==null?s:s.replace(k,v)};
const L=s=>LANG==='en'?tr(s):s;
const store=new WeakMap();
function tnode(n){const r=store.get(n),o=(r&&n.nodeValue===r.t)?r.o:n.nodeValue,t=LANG==='en'?tr(o):o;if(n.nodeValue!==t)n.nodeValue=t;store.set(n,{o,t})}
function tattr(el,a){const cur=el.getAttribute(a);if(cur==null)return;const key='_o_'+a,r=el[key],o=(r&&cur===r.t)?r.o:cur,t=LANG==='en'?tr(o):o;if(cur!==t)el.setAttribute(a,t);el[key]={o,t}}
function applyLang(){
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){if(/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))continue;tnode(n)}
 document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(a=>tattr(el,a)));
 document.documentElement.lang=LANG==='en'?'en':'zh-CN';
 document.title=LANG==='en'?'Sip Notes · One cup, one page':'Sip Notes · 一杯一页';
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG))}
const MO={childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']};
const mo=new MutationObserver(()=>{mo.disconnect();applyLang();mo.observe(document.body,MO)});
document.querySelector('.lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;try{localStorage.setItem('sip-lang',LANG)}catch(x){}applyLang();render()};

const DRINKS=['咖啡','茶','抹茶','奶茶','其他'],TEMPS=['热','冰','温','其他'],MOODS=['平静','受启发','有连接','思考','放松','有活力'];
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
let entries=load('sip3-entries'),people=load('sip3-people');
if(!entries.length){ // migrate v2
  entries=load('sip2-entries').map(o=>({id:o.id,ts:o.id,photo:o.photo||'',note:o.note||'',title:o.caption||'',story:o.summary||o.talk||'',place:o.place?{text:o.place,source:'manual'}:null,drink:o.drink||'',temp:o.temp||'',sweet:o.sweet||'',price:o.price||'',rating:o.rating||0,mood:'',withType:o.withType||'',pid:o.pid,topics:o.topics||[]}));
  people=load('sip2-people');
}
const persist=()=>{try{localStorage.setItem('sip3-entries',JSON.stringify(entries));localStorage.setItem('sip3-people',JSON.stringify(people))}catch(e){}};
let sample=null,downloads=null,thumb='',file=null,draft=null;
const S={withType:'',drink:'',temp:'',sweet:'',rating:0,moods:[]};
function aiImg(f){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=1024/Math.max(i.width,i.height,1024),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};i.onerror=()=>rej(Object.assign(new Error('img'),{code:'image_rejected'}));i.src=u})}
sample={json:async(prompt,o={})=>{const images=[];for(const f of (o.images||[]))images.push(await aiImg(f));
 const r=await fetch('/api/organize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,images})});
 if(!r.ok)throw Object.assign(new Error('ai'),{code:r.status===429?'rate_limited':'failed'});return r.json()}};
downloads={save:async({filename,data,mime})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'application/json'}));a.download=filename;a.click()}};
const say=t=>$('#status').textContent=t;
